name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libvmx needs clang (-fdeclspec) on Linux; ubuntu-latest ships it.
      - name: Test
        run: cargo test -p omt-rs --all-targets

  # The official libomt, built from source, against omt-rs in both directions.
  interop:
    name: Interop vs libomt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the official libomt (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build-libomt.sh "$RUNNER_TEMP/libomt"
      - name: Build the official libomt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-libomt.ps1 -Out "$env:RUNNER_TEMP\libomt"
      - name: Interop tests
        shell: bash
        run: OMT_LIB_DIR="$RUNNER_TEMP/libomt" cargo test -p omt-rs --features interop --test interop

  # Mobile targets build (DrawLive ships omt-rs on Android and iOS).
  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build
        run: cargo ndk -t arm64-v8a -t armeabi-v7a build -p omt-rs

  ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build -p omt-rs --target aarch64-apple-ios
          cargo build -p omt-rs --target aarch64-apple-ios-sim

  gstreamer:
    name: GStreamer plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Install GStreamer (macOS)
        if: runner.os == 'macOS'
        run: brew install gstreamer pkgconf
      # The official MSVC installer with its development files.
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.28.6"
          $exe = "$env:RUNNER_TEMP\gstreamer.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/gstreamer-1.0-msvc-x86_64-$v.exe" -OutFile $exe
          Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TYPE=full" -Wait
          $root = "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          "$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG=$root\bin\pkg-config.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Test
        run: cargo test -p gst-plugin-omt
      - name: Build the plugin
        run: cargo build -p gst-plugin-omt --release
      - name: Inspect
        shell: bash
        run: GST_PLUGIN_PATH="$PWD/target/release" gst-inspect-1.0 omt
