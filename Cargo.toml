[workspace]
resolver = "2"
members = ["crates/omt-rs", "crates/gst-plugin-omt"]
# The plugin needs GStreamer's development files; plain `cargo build` /
# `cargo test` stays on the library. Use `-p gst-plugin-omt` (or --workspace).
default-members = ["crates/omt-rs"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/meros-co/omt-rs"
rust-version = "1.85"

# The clock-recovery tests simulate eight hours of frames; optimise test
# builds so they take seconds, not minutes. Affects this workspace only.
[profile.test]
opt-level = 2
